name: Release

# Pushing a tag like `v0.2.0` runs CI and attaches the tarball CI built and tested to a GitHub Release, with a build
# provenance attestation. The sites install that tarball by URL; their lockfiles record its checksum, so an asset is
# never replaced: a release that already exists fails this workflow — fix forward with a new version instead.
#
# Release steps: bump `version` in package.json, add its `## <version>` section to CHANGELOG.md, merge, then
#   git tag v<version> && git push origin v<version>
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag, version and changelog agree
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tgz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Install with:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename dist/*.tgz)" >> "$GITHUB_STEP_SUMMARY"
